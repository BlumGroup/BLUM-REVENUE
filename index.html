function parseIcal(t){if(typeof t!=='string'||!/BEGIN:VCALENDAR/.test(t))throw Error('no es un calendario iCal');const u=t.replace(/\r\n[ \t]/g,'').replace(/\n[ \t]/g,'').replace(/\r/g,''),o=[];
 for(const part of u.split('BEGIN:VEVENT').slice(1)){const e=part.split('END:VEVENT')[0],g=k=>(e.match(new RegExp('^'+k+'(?:;[^:\\n]*)?:(.*)$','m'))||[])[1]?.trim()||'';const s=g('DTSTART').slice(0,8),n=g('DTEND').slice(0,8);if(!/^\d{8}$/.test(s)||!/^\d{8}$/.test(n))continue;
  const f=x=>`${x.slice(0,4)}-${x.slice(4,6)}-${x.slice(6,8)}`,start=f(s),end=f(n);if(end<=start)continue;const sum=g('SUMMARY'),desc=g('DESCRIPTION');o.push({uid:g('UID'),start,end,reserved:/reserv|booking|reserva|guest|huésped/i.test(sum)||/reservation/i.test(desc)})}return o}
function applyIcal(p,evs){const blocks=new Set(),stays=[];p.icalWindow='';for(const e of evs){if(!e.reserved&&diff(e.start,e.end)>=60&&diff(T,e.start)>=14){p.icalWindow=e.start;continue}if(e.reserved||p.naAsBooking)stays.push(e);else{let d=e.start;for(let i=0;d<e.end&&i<400;i++,d=addDays(d,1))blocks.add(d)}}
 const keepS=p.stays.filter(s=>(s.source!=='ical'&&s.source!=='demo')||s.end<T);let added=0;for(const e of stays){if(keepS.some(s=>s.source==='ical'&&(s.uid&&s.uid===e.uid||s.start===e.start&&s.end===e.end)))continue;if(keepS.some(s=>s.source==='manual'&&e.start<s.end&&e.end>s.start))continue;keepS.push({id:e.uid?e.uid.replace(/\W/g,'').slice(0,24):uid(),uid:e.uid,start:e.start,end:e.end,source:'ical'});added++}
 p.stays=keepS;p.icalBlocks=[...blocks].sort();p.icalSync=new Date().toISOString();return `${p.name}: ${added} estadías, ${blocks.size} noches bloqueadas`}
async function fetchIcal(url){const tries=[url];if(state.settings.proxy)tries.push(state.settings.proxy+(state.settings.proxy.includes('?')?'&':'?')+'url='+encodeURIComponent(url));let last;for(const u of tries){try{const r=await fetch(u);if(!r.ok)throw Error('HTTP '+r.status);const t=await r.text();if(/BEGIN:VCALENDAR/.test(t))return t;throw Error('respuesta inválida')}catch(e){last=e}}throw last}

const okey=o=>o.date+'|'+o.checked;
function mergeObs(local,remote){const m=new Map(local.map(o=>[okey(o),o]));for(const o of remote||[]){if(!o||!o.date||!o.checked)continue;if(!m.has(okey(o))&&!(o.checked===T&&o.src!=='claude'))m.set(okey(o),{date:String(o.date),status:o.status==='x'?'x':'ok',price:num(o.price),checked:String(o.checked),src:o.src==='claude'?'claude':undefined})}const lim=addDays(T,-120);return [...m.values()].filter(o=>o.date>=lim)}
function schedFlush(){setLbl('Guardando…');clearTimeout(flushT);flushT=setTimeout(flush,700)}
async function flush(){if(flushing){again=true;return}flushing=true;try{
 const ids=new Set();for(const [i,p] of state.properties.entries()){p.order=i;ids.add(p.id);const b=propBody(p),sb=JSON.stringify(b);if(SAVED['p'+p.id]!==sb){await DB.doc('props/'+p.id).set(b);SAVED['p'+p.id]=sb}
  const mk={comps:Object.fromEntries(p.competitors.map(c=>[c.id,c.obs]))},sm=JSON.stringify(mk);if(SAVED['m'+p.id]!==sm){const fr=await DB.doc('market/'+p.id).get();const rc=fr.exists?fr.data().comps||{}:{};for(const c of p.competitors)c.obs=mergeObs(c.obs,rc[c.id]);const body={comps:Object.fromEntries(p.competitors.map(c=>[c.id,c.obs]))};await DB.doc('market/'+p.id).set(body);SAVED['m'+p.id]=JSON.stringify(body)}}
 for(const k of Object.keys(SAVED))if(k[0]==='p'&&!ids.has(k.slice(1))){const id=k.slice(1);await DB.doc('props/'+id).delete();await DB.doc('market/'+id).delete();delete SAVED[k];delete SAVED['m'+id]}
 const st=settingsBody(),ss=JSON.stringify(st);if(SAVED.s!==ss){await DB.doc('app/settings').set(st);SAVED.s=ss}
 setLbl('Sincronizado '+new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}))}catch(e){setLbl('Sin sincronizar');if(e?.code==='quota_exceeded')toast('La base está llena: borra datos antiguos o inmuebles.')}
 flushing=false;if(again){again=false;flush()}}
async function boot(){const g=ghCfg();if(g)return bootGh(g);if(!(window.claude&&typeof window.claude.use==='function')){setLbl('Datos solo en este navegador');return}

 try{const [ps,mk,st,rs]=await Promise.all([db.collection('props').get(),db.collection('market').get(),db.doc('app/settings').get(),db.doc('research/events').get()]);clearTimeout(timer);
  const ui={view:state.view,selected:state.selected,year:state.year,calMonth:state.calMonth,week:state.week};

   for(const p of props)p.competitors=(p.competitors||[]).map(c=>({...c,obs:mergeObs([],(mmap[p.id]||{})[c.id]).map(o=>({...o}))}));
   const sd=st.exists?st.data():{};state=normalize({version:3,properties:props,settings:sd.settings,events:sd.events||[],cleanings:sd.cleanings||{},extras:sd.extras||[],...ui});
   for(const p of state.properties){SAVED['p'+p.id]=JSON.stringify(propBody(p));SAVED['m'+p.id]=JSON.stringify({comps:Object.fromEntries(p.competitors.map(c=>[c.id,c.obs]))})}if(st.exists)SAVED.s=JSON.stringify(settingsBody())}
  else if(!state.properties.length||state.demo){state=normalize({properties:[],events:[],settings:state.demo?defSettings():state.settings,...ui});state.view='hoy'}
  if(rs.exists)state.research=Array.isArray(rs.data().items)?rs.data().items:[];

const GHK='blum_gh',ghCfg=()=>{try{const g=JSON.parse(localStorage.getItem(GHK));return g&&g.owner&&g.repo&&g.token?g:null}catch{return null}};
let GH=null,ghLoaded=false,ghSha={},ghLast='',ghT=null,ghBusy=false,ghAgain=false;
const b64e=s=>{const b=new TextEncoder().encode(s);let x='';for(let i=0;i<b.length;i+=0x8000)x+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(x)};
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(String(s).replace(/\s/g,'')),c=>c.charCodeAt(0)));
async function ghReq(g,path,opt={}){const url=`https://api.github.com/repos/${encodeURIComponent(g.owner)}/${encodeURIComponent(g.repo)}/contents/${path}`+(opt.method?'':'?ref='+encodeURIComponent(g.branch||'main')+'&t='+Date.now());
 const r=await fetch(url,{method:opt.method||'GET',headers:{Authorization:'Bearer '+g.token,Accept:'application/vnd.github+json'},body:opt.body?JSON.stringify(opt.body):undefined,cache:'no-store'});
 if(r.status===404)return null;if(!r.ok){const e=new Error(r.status===401?'token inválido':r.status===403?'sin permiso o límite de GitHub':'GitHub '+r.status);e.status=r.status;throw e}return r.json()}
async function ghGet(g,path){const j=await ghReq(g,path);if(!j)return null;if(Array.isArray(j))return {list:j};let txt=j.content?b64d(j.content):'';if(!txt&&j.download_url){const r=await fetch(j.download_url,{headers:{Authorization:'Bearer '+g.token},cache:'no-store'});txt=await r.text()}return {sha:j.sha,data:txt?JSON.parse(txt):null}}
const ghPut=(g,path,obj,sha,msg)=>ghReq(g,path,{method:'PUT',body:{message:msg,content:b64e(JSON.stringify(obj,null,1)),sha:sha||undefined,branch:g.branch||'main'}});
const ghBody=()=>({version:3,updated:new Date().toISOString(),properties:state.properties,events:state.events,settings:state.settings,cleanings:settingsBody().cleanings,extras:state.extras});
function ghSched(){setLbl('Guardando en GitHub…');clearTimeout(ghT);ghT=setTimeout(ghFlush,2500)}
async function ghFlush(){if(ghBusy){ghAgain=true;return}ghBusy=true;try{const body=ghBody(),{updated,...cmp}=body,s=JSON.stringify(cmp);if(s!==ghLast){let r;try{r=await ghPut(GH,'data/state.json',body,ghSha.state,'Actualiza datos desde la app')}catch(e){if(e.status===409||e.status===422){const cur=await ghGet(GH,'data/state.json');ghSha.state=cur?.sha;r=await ghPut(GH,'data/state.json',body,ghSha.state,'Actualiza datos desde la app')}else throw e}ghSha.state=r.content.sha;ghLast=s}setLbl('GitHub · guardado '+new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}))}catch(e){setLbl('GitHub · sin guardar');toast('No se pudo guardar en GitHub: '+e.message)}ghBusy=false;if(ghAgain){ghAgain=false;ghFlush()}}
async function ghPull(first){const g=GH;const [rs,mc,rd,ic]=await Promise.all([ghGet(g,'data/research.json').catch(()=>null),ghGet(g,'data/market-claude.json').catch(()=>null),ghGet(g,'data/reports').catch(()=>null),ghGet(g,'data/ical-claude.json').catch(()=>null)]);let ch=false;
 for(const p of state.properties){const x=ic?.data?.[p.id];if(x&&Array.isArray(x.events)&&x.syncedAt&&(!p.icalSync||x.syncedAt>p.icalSync)){applyIcal(p,x.events.filter(e=>/^\d{4}-\d\d-\d\d$/.test(e.start)&&/^\d{4}-\d\d-\d\d$/.test(e.end)&&e.end>e.start).map(e=>({uid:String(e.uid||''),start:e.start,end:e.end,reserved:!!e.reserved})));p.icalSync=x.syncedAt;ch=true}}
 const it=Array.isArray(rs?.data?.items)?rs.data.items:[];if(JSON.stringify(it)!==JSON.stringify(state.research)){state.research=it;ch=true}
 const mm=mc?.data||{};for(const p of state.properties){const rc=mm[p.id]||{};for(const c of p.competitors){const n=mergeObs(c.obs,rc[c.id]);if(n.length!==c.obs.length){c.obs=n;ch=true}}}
 const names=(rd?.list||[]).map(f=>f.name).filter(n=>/^\d{4}-\d{2}-\d{2}\.json$/.test(n)).sort().slice(-2);const reps={};for(const n of names){const f=await ghGet(g,'data/reports/'+n).catch(()=>null);if(f?.data?.date)reps[f.data.date]=f.data}
 if(JSON.stringify(reps)!==JSON.stringify(state.reports)){state.reports=reps;ch=true}if(ch||first)render()}
async function bootGh(g){GH=g;setLbl('Conectando a GitHub…');try{const st=await ghGet(g,'data/state.json');const ui={view:state.view,selected:state.selected,year:state.year,calMonth:state.calMonth,week:state.week};
 if(st?.data?.properties){ghSha.state=st.sha;const d=st.data;state=normalize({version:3,properties:d.properties,events:d.events||[],settings:d.settings,cleanings:d.cleanings||{},extras:d.extras||[],...ui});const{updated,...cmp}=ghBody();ghLast=JSON.stringify(cmp)}
